name: Planrova CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-quality-check:
    name: Web Quality, Tests & Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Vitest Unit & Integration Tests
        run: npm test

      - name: Production Web Build
        run: npm run build

      - name: Verify Build Artifacts
        run: |
          test -f dist/index.html || (echo "dist/index.html is missing" && exit 1)
          test -d dist/assets || (echo "dist/assets directory is missing" && exit 1)

      - name: Security & Dependency Audit
        run: npm audit --audit-level=critical
        continue-on-error: true

  server-quality-check:
    name: Backend Proxy Syntax & Test Verification
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Server Proxy Syntax
        run: node --check server/proxy.js

  mobile-quality-check:
    name: Mobile Syntax, Contract & Storage Verification
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Verify Mobile Entrypoint and Hook Syntax
        run: |
          node --check mobile/index.js
          node --check mobile/App.js
          node --check mobile/src/firebase.js
          node --check mobile/src/hooks/useFirestoreData.js
          node --check mobile/src/screens/ProjectsScreen.js
          node --check mobile/src/screens/AuthScreen.js
          node --check mobile/src/screens/OnboardingScreen.js
          node --check mobile/src/components/UnlockingOverlay.js

      - name: Run Mobile Offline Durability & Storage Contract Tests
        run: npx vitest run tests/mobileStorage.test.js


